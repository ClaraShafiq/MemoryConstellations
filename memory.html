<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Memory Constellations</title>
<link rel="stylesheet" href="/styles/memory.css">
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="mc"></canvas>

<div id="breadcrumb"></div>

<div id="topbar">
  <span class="tb-title">Memory Universe</span>
  <nav class="galaxy-pills" id="galaxy-pills">
    <button class="gpill active" data-galaxy="">全部</button>
  </nav>
  <div class="tb-sep"></div>
  <button class="stardust-btn" id="stardust-btn" title="星尘 · 观测日志">✦</button>
  <button class="tb-action" id="import-btn" title="导入聊天记录（JSONL/TXT）">导入</button>
  <button class="tb-action" id="export-btn" title="导出记忆库（JSONL）">导出</button>
  <span class="tb-count" id="tb-count">— fragments</span>
</div>

<div id="panel">
  <div class="p-resize p-resize-br" data-dir="br" title="拖动调整卡片大小"></div>
  <div class="p-resize p-resize-bl" data-dir="bl" title="拖动调整卡片大小"></div>
  <button id="panel-close">✕</button>
  <div class="p-accent" id="p-accent"></div>
  <div class="p-cat" id="p-cat"></div>
  <div class="p-title" id="p-title"></div>
  <div class="p-body" id="p-body"></div>
  <div class="p-tags" id="p-tags"></div>
  <div id="p-meta"></div>
  <div class="p-date" id="p-date"></div>
</div>

<div id="archlog" class="collapsed">
  <div id="arch-header">
    <div class="arch-pulse"></div>
    <span class="arch-title">观星手记</span>
    <span class="arch-sub">AI · 归档代理</span>
    <span class="arch-chevron">▲</span>
  </div>
  <div id="arch-body"></div>
</div>

<div id="model-panel" class="collapsed">
  <div class="mp-header" id="mp-header">
    <div class="mp-dot"></div>
    <span class="mp-title">认知模型</span>
    <span class="mp-chevron">▲</span>
  </div>
  <div id="mp-body"></div>
</div>

<div id="model-detail">
  <div id="md-content"></div>
</div>

<div id="core-insight-panel" class="collapsed">
  <div class="mp-header" id="ci-header">
    <div class="mp-dot" style="background:#c9a96e"></div>
    <span class="mp-title">核心洞察</span>
    <span class="mp-chevron">▲</span>
  </div>
  <div id="ci-body" style="display:none">
    <textarea id="ci-editor" rows="4" placeholder="AI 对 User 当前最深的理解……"></textarea>
    <div style="margin-top:6px;font-size:11px;color:#888">
      <span id="ci-updated"></span>
      <button id="ci-save" style="margin-left:8px;padding:2px 10px">保存</button>
    </div>
  </div>
</div>

<div id="merge-proposals" style="display:none">
  <div class="mq-header">
    <div class="mq-dot"></div>
    <span class="mq-title">AI 的疑问</span>
    <span class="mq-count" id="mq-count"></span>
  </div>
  <div id="mq-body"></div>
</div>

<div id="tt"></div>
<div id="hint">scroll to zoom · drag to pan<br>click to dive in · Esc to surface</div>

<!-- 星尘透镜 -->
<div id="stardust-overlay">
  <div id="stardust-lens">
    <div id="stardust-header">
      <span class="sd-title">✦ 星尘 · 观测日志</span>
      <input id="sd-search" placeholder="搜索信号..." autocomplete="off">
      <select id="sd-filter">
        <option value="1">最近24小时</option>
        <option value="3">最近3天</option>
        <option value="7" selected>最近7天</option>
        <option value="30">最近30天</option>
      </select>
      <button id="sd-close">✕</button>
    </div>
    <div id="stardust-body"></div>
    <div id="stardust-hint">点击信号展开详情 · 点击星座名跳转星图 · 点击空白处关闭</div>
  </div>
</div>
<!-- 导入聊天记录 弹窗 -->
<div id="import-overlay" style="display:none">
  <div id="import-lens">
    <div id="import-header">
      <span class="imp-title">导入聊天记录</span>
      <button id="import-close">✕</button>
    </div>
    <div id="import-drop" class="imp-drop">
      <input type="file" id="import-file" accept=".txt,.jsonl,.json">
      <div class="imp-drop-hint">点击选择文件，或拖拽到这里</div>
      <div class="imp-drop-sub">支持 JSON 数组 / JSONL / TXT（名字: 内容）</div>
    </div>
    <div id="import-preview" style="display:none"></div>
    <div id="import-actions" style="display:none">
      <button id="import-confirm" class="imp-confirm">确认导入</button>
      <span class="imp-count" id="import-count"></span>
    </div>
    <div id="import-result"></div>
  </div>
</div>

<style>
  .tb-action {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(100,120,255,0.12);
    color: rgba(150,170,240,0.55); font-size: 11px; padding: 4px 11px; border-radius: 10px;
    cursor: pointer; transition: all .2s; font-family: inherit; white-space: nowrap;
    pointer-events: all;
  }
  .tb-action:hover { background: rgba(255,255,255,0.07); color: rgba(200,215,255,0.85); border-color: rgba(120,140,255,0.3); }

  #import-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(2,4,16,0.6); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  #import-lens {
    background: rgba(3,6,22,0.88); backdrop-filter: blur(28px);
    border: 1px solid rgba(100,120,255,0.16); border-radius: 16px;
    padding: 22px; width: 480px; max-width: 92vw; max-height: 84vh; overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #import-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .imp-title { font-size: 14px; font-weight: 500; color: #e4e8ff; letter-spacing: .03em; }
  #import-close { background: none; border: none; color: rgba(130,150,210,0.35); cursor: pointer; font-size: 14px; padding: 4px; }
  #import-close:hover { color: rgba(190,210,255,0.7); }

  .imp-drop {
    position: relative; border: 1px dashed rgba(100,120,255,0.25); border-radius: 12px;
    padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
  }
  .imp-drop:hover, .imp-drop.dragover { border-color: rgba(130,160,255,0.5); background: rgba(100,120,255,0.05); }
  .imp-drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .imp-drop-hint { font-size: 13px; color: rgba(200,215,255,0.85); }
  .imp-drop-sub { font-size: 10.5px; color: rgba(120,140,185,0.45); margin-top: 6px; }

  #import-preview {
    margin-top: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 12px; font-size: 11px; line-height: 1.6;
    color: rgba(180,200,240,0.62); max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  #import-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .imp-confirm {
    background: rgba(100,120,255,0.14); border: 1px solid rgba(120,140,255,0.4);
    color: rgba(220,230,255,0.92); font-size: 12px; padding: 7px 18px; border-radius: 10px;
    cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .imp-confirm:hover { background: rgba(110,130,255,0.22); box-shadow: 0 0 8px rgba(100,120,255,0.25); }
  .imp-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
  .imp-count { font-size: 10.5px; color: rgba(140,160,210,0.5); }
  #import-result { margin-top: 12px; font-size: 11.5px; line-height: 1.6; color: rgba(140,165,240,0.75); }
  #import-result.err { color: rgba(255,130,140,0.8); }
  #import-result.ok { color: rgba(110,220,190,0.85); }
</style>

<script>
(function () {
  var overlay = document.getElementById('import-overlay');
  var fileInput = document.getElementById('import-file');
  var drop = document.getElementById('import-drop');
  var preview = document.getElementById('import-preview');
  var actions = document.getElementById('import-actions');
  var confirmBtn = document.getElementById('import-confirm');
  var countEl = document.getElementById('import-count');
  var resultEl = document.getElementById('import-result');
  var fileText = '';

  function reset() {
    fileText = ''; preview.style.display = 'none'; actions.style.display = 'none';
    resultEl.textContent = ''; resultEl.className = ''; confirmBtn.disabled = false;
    fileInput.value = '';
  }
  function open() { reset(); overlay.style.display = 'flex'; }
  function close() { overlay.style.display = 'none'; }

  document.getElementById('import-btn').addEventListener('click', open);
  document.getElementById('import-close').addEventListener('click', close);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });

  ['dragover', 'dragenter'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('dragover'); });
  });
  drop.addEventListener('drop', function (e) {
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      fileText = String(reader.result || '');
      var lines = fileText.split('\n').filter(function (l) { return l.trim(); });
      preview.textContent = lines.slice(0, 8).join('\n') + (lines.length > 8 ? '\n…' : '');
      preview.style.display = 'block';
      actions.style.display = 'flex';
      countEl.textContent = '约 ' + lines.length + ' 行';
    };
    reader.readAsText(file);
  }

  confirmBtn.addEventListener('click', function () {
    if (!fileText.trim()) return;
    confirmBtn.disabled = true;
    resultEl.textContent = '导入中…'; resultEl.className = '';
    fetch('/api/import/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: fileText })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.success) {
        resultEl.textContent = '✓ 已导入 ' + data.count + ' 条消息（用户 ' + data.userCount + ' / AI ' + data.aiCount + '）。后台会在大约 2 分钟内开始提取记忆。';
        resultEl.className = 'ok';
        preview.style.display = 'none'; actions.style.display = 'none';
      } else {
        resultEl.textContent = '导入失败：' + (data.error || '未知错误');
        resultEl.className = 'err';
        confirmBtn.disabled = false;
      }
    }).catch(function (e) {
      resultEl.textContent = '导入失败：' + e.message;
      resultEl.className = 'err';
      confirmBtn.disabled = false;
    });
  });

  document.getElementById('export-btn').addEventListener('click', function () {
    window.location.href = '/api/export/memory';
  });
})();
</script>

<div id="display-controls">
  <label>亮度 <input id="dc-bright" type="range" min="0.8" max="2.2" step="0.05"><span class="dc-val" id="dc-bright-val"></span></label>
  <label>字号 <input id="dc-font" type="range" min="10" max="18" step="0.5"><span class="dc-val" id="dc-font-val"></span></label>
  <button id="dc-reset" title="恢复默认亮度与字号">重置</button>
</div>

<script>
/* 显示控制：亮度 / 正文字号 / 面板拖拽尺寸，全部存 localStorage */
(function () {
  var KEY = 'mc-display-v1';
  var DEF = { bright: 1.35, font: 11.5 };
  var cfg = Object.assign({}, DEF);
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  var root = document.documentElement;
  var bEl = document.getElementById('dc-bright');
  var fEl = document.getElementById('dc-font');
  var bVal = document.getElementById('dc-bright-val');
  var fVal = document.getElementById('dc-font-val');

  function save() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }
  function apply() {
    root.style.setProperty('--ui-bright', cfg.bright);
    root.style.setProperty('--pbody-fs', cfg.font + 'px');
    bEl.value = cfg.bright; fEl.value = cfg.font;
    bVal.textContent = (+cfg.bright).toFixed(2) + '×';
    fVal.textContent = (+cfg.font).toFixed(1) + 'px';
  }

  bEl.addEventListener('input', function () { cfg.bright = +this.value; apply(); });
  bEl.addEventListener('change', save);
  fEl.addEventListener('input', function () { cfg.font = +this.value; apply(); });
  fEl.addEventListener('change', save);
  document.getElementById('dc-reset').addEventListener('click', function () {
    cfg.bright = DEF.bright; cfg.font = DEF.font;
    delete cfg.panelW; delete cfg.panelH;
    root.style.removeProperty('--panel-w');
    root.style.removeProperty('--panel-mh');
    root.style.removeProperty('--pbody-mh');
    apply(); save();
  });

  apply();

  /* 面板拖拽：右下 / 左下两个把手，尺寸记进 localStorage（卡片、观星手记、认知模型通用） */
  function attachResize(el, keyW, keyH, opts) {
    if (!el) return;
    opts = opts || {};
    var mk = function (dir) {
      var d = document.createElement('div');
      d.className = 'p-resize p-resize-' + dir;
      d.dataset.dir = dir;
      d.title = '拖动调整大小';
      el.appendChild(d);
      return d;
    };
    var handles = [mk('br'), mk('bl')];
    if (cfg[keyW]) el.style.width = cfg[keyW] + 'px';
    if (cfg[keyH] && !el.classList.contains('collapsed')) el.style.height = cfg[keyH] + 'px';

    var drag = null;
    handles.forEach(function (h) {
      h.addEventListener('pointerdown', function (e) {
        e.preventDefault(); e.stopPropagation();
        h.setPointerCapture(e.pointerId);
        drag = { dir: h.dataset.dir, x0: e.clientX, y0: e.clientY, w0: el.offsetWidth, h0: el.offsetHeight };
        el.classList.add('dragging');
      });
      h.addEventListener('pointermove', function (e) {
        if (!drag) return;
        var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
        var w = drag.dir === 'br' ? drag.w0 + dx : drag.w0 - dx;
        var hh = drag.h0 + dy;
        w = Math.max(opts.minW || 240, Math.min(w, Math.round(window.innerWidth * 0.78)));
        hh = Math.max(opts.minH || 120, Math.min(hh, Math.round(window.innerHeight * 0.92)));
        cfg[keyW] = Math.round(w);
        cfg[keyH] = Math.round(hh);
        el.style.width = cfg[keyW] + 'px';
        el.style.height = cfg[keyH] + 'px';
        if (opts.onResize) opts.onResize(cfg[keyW], cfg[keyH]);
      });
      var stop = function () { if (drag) { drag = null; el.classList.remove('dragging'); save(); } };
      h.addEventListener('pointerup', stop);
      h.addEventListener('pointercancel', stop);
    });
  }

  var panel = document.getElementById('panel');
  if (panel) {
    if (cfg.panelW) root.style.setProperty('--panel-w', cfg.panelW + 'px');
    if (cfg.panelH) root.style.setProperty('--panel-mh', cfg.panelH + 'px');
    attachResize(panel, 'panelW', 'panelH', {
      minW: 240, minH: 180,
      onResize: function (w, h) {
        root.style.setProperty('--panel-w', w + 'px');
        root.style.setProperty('--panel-mh', h + 'px');
        root.style.setProperty('--pbody-mh', Math.max(150, Math.round(h * 0.45)) + 'px');
      }
    });
  }

  attachResize(document.getElementById('archlog'), 'archW', 'archH', { minW: 240, minH: 120 });
  attachResize(document.getElementById('model-panel'), 'modelW', 'modelH', { minW: 240, minH: 120 });
})();
</script>

<script src="/shared/memoryRoutes.js"></script>
<script type="module" src="/js/memory/main.js"></script>
</body>
</html>
